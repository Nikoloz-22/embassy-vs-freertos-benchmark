[package]
name = "blackpill_benchmarks"
version = "0.1.0"
edition = "2021"
build = "build.rs"

[dependencies]
cortex-m = { version = "=0.7.7", features = ["inline-asm", "critical-section-single-core"] }
cortex-m-rt = "=0.7.3"
defmt = "=0.3.8"
defmt-rtt = "=0.4.1"
panic-probe = { version = "=0.3.2", features = ["print-defmt"] }
embassy-executor = { version = "=0.7.0", features = ["task-arena-size-4096", "arch-cortex-m", "executor-thread"] }
embassy-stm32 = { version = "=0.2.0", features = ["defmt", "stm32f411ce"] }
embassy-sync = "=0.6.2"

[profile.release]
opt-level = 3
debug = 2
lto = false
codegen-units = 1
panic = "abort"

